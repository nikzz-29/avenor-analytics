services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: avenor
      POSTGRES_USER: avenor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avenor}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avenor"]
      interval: 3s
      timeout: 3s
      retries: 20
  mail:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  api:
    build: {context: ., dockerfile: infra/api.Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg://avenor:${POSTGRES_PASSWORD:-avenor}@db:5432/avenor
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: mail
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      mail: {condition: service_started}
  web:
    build: {context: ., dockerfile: infra/web.Dockerfile}
    environment:
      API_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  postgres-data:
