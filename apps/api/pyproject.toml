[project]
name = "avenor-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
 "fastapi>=0.115,<1",
 "uvicorn[standard]>=0.34,<1",
 "sqlalchemy[asyncio]>=2.0,<3",
 "psycopg[binary]>=3.2,<4",
 "alembic>=1.15,<2",
 "pydantic-settings>=2.8,<3",
 "argon2-cffi>=23.1",
 "python-multipart>=0.0.20",
 "email-validator>=2.2",
 "openpyxl>=3.1,<4",
 "polars>=1.25,<2",
 "defusedxml>=0.7.1",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "httpx>=0.28", "ruff>=0.11", "mypy>=1.15", "types-openpyxl"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
